name: Workbench verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install controller dependencies
        run: python -m pip install -e '.[server]'
      - name: Windows startup, locking and PowerShell guide
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $guide = (Get-Content docs/27-windows11.md,docs/28-local-configuration.md -Raw -Encoding utf8) -join "`n"
          foreach ($block in [regex]::Matches($guide, '(?ms)^```powershell\r?\n(.*?)^```')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseInput($block.Groups[1].Value, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          python -m unittest discover -s tests -p test_platform_support.py -v
      - name: Build Web interface
        run: |
          npm ci --prefix web --no-audit --no-fund
          npm run --prefix web build
          npm test --prefix web
      - name: Native Windows CMD and PowerShell lifecycle in a fresh venv
        if: runner.os == 'Windows'
        run: python poc/verify_windows_launcher.py
      - name: Workspace and local control API tests
        run: python poc/run_unit_tests.py
      - name: Sample backend tests
        run: node --test poc/sample-project/server.test.mjs

